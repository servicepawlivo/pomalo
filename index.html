<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E6BA8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pomalo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Pomalo Kroatisch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Kroatisch lernen – täglich, kostenlos, mit Lernpfad, Wiederholung und Aussprache.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: eine schmale App-Spalte (max 560px) – Lernpfad wie eine Küstenstraße,
   Einheiten als farbige Bänder mit Šahovnica-Kante, Dalmatiner „Pjegica“ als Begleiter. */
:root {
  --bg: #F2F5F1;          /* Kalkstein, leicht grünlich */
  --surface: #FFFFFF;
  --surface-2: #E7ECE6;
  --ink: #12242F;          /* tiefes Adriablau-Schwarz */
  --ink-2: #536570;
  --line: #D4DCD5;
  --sea: #0E6BA8;          /* Adria */
  --sea-deep: #0A4F7D;
  --sea-soft: #DDEBF5;
  --red: #D62839;          /* Šahovnica / Licitar-Rot */
  --red-deep: #A51D2B;
  --sun: #E8940F;          /* Streak & XP */
  --sun-soft: #FCEFD7;
  --good: #3A8A3D;
  --good-deep: #2A6A2D;
  --good-soft: #E1F1DC;
  --bad: #C8323F;
  --bad-deep: #9A2430;
  --bad-soft: #FAE2E4;
  --lock: #C9D1CB;
  --lock-deep: #AEB8B1;
  --ru: #6B4FA0;
  --ru-soft: #EEE8F7;
  --shadow: 0 1px 2px rgba(18, 36, 47, .06), 0 6px 18px rgba(18, 36, 47, .07);
  --f-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 16px;
  --col: 560px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1820; --surface: #14252F; --surface-2: #1C323D; --ink: #E6EEF0; --ink-2: #9AAFB8; --line: #284150;
    --sea: #3F9BD8; --sea-deep: #24699A; --sea-soft: #12344A; --red: #EE4E5D; --red-deep: #B23240;
    --sun: #F4AE45; --sun-soft: #3A2D14; --good: #63B85B; --good-deep: #3E8A38; --good-soft: #163221;
    --bad: #F06A73; --bad-deep: #B3414B; --bad-soft: #3A1B22; --lock: #2F4655; --lock-deep: #243845;
    --ru: #B79BEA; --ru-soft: #2A2240; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1820; --surface: #14252F; --surface-2: #1C323D; --ink: #E6EEF0; --ink-2: #9AAFB8; --line: #284150;
  --sea: #3F9BD8; --sea-deep: #24699A; --sea-soft: #12344A; --red: #EE4E5D; --red-deep: #B23240;
  --sun: #F4AE45; --sun-soft: #3A2D14; --good: #63B85B; --good-deep: #3E8A38; --good-soft: #163221;
  --bad: #F06A73; --bad-deep: #B3414B; --bad-soft: #3A1B22; --lock: #2F4655; --lock-deep: #243845;
  --ru: #B79BEA; --ru-soft: #2A2240; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
.mascot { width: 64px; height: 64px; display: block; flex: none; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible { outline: 3px solid var(--sea); outline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; }
p { margin: 0 0 .7em; }
.hr { font-family: var(--f-display); }
.muted { color: var(--ink-2); }
.wrap { max-width: var(--col); margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- Top bar ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-weight: 800; font-size: 22px; letter-spacing: -.01em; margin-right: auto; }
.brand-mark { width: 18px; height: 18px; border-radius: 4px; background: conic-gradient(var(--red) 25%, #fff 0 50%, var(--red) 0 75%, #fff 0) 0 0 / 9px 9px; box-shadow: inset 0 0 0 1.5px var(--red); }
.brand small { font-family: var(--f-body); font-weight: 600; font-size: 12px; color: var(--ink-2); letter-spacing: .02em; }
.stat-chip { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; font-variant-numeric: tabular-nums; padding: 4px 10px 4px 6px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
.stat-chip svg { width: 20px; height: 20px; }
.stat-chip.cold { color: var(--ink-2); }
.ring { position: relative; width: 34px; height: 34px; }
.ring svg { width: 34px; height: 34px; transform: rotate(-90deg); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 10px; font-variant-numeric: tabular-nums; }

/* ---------- Main view / tabs ---------- */
#view { padding-bottom: calc(92px + env(safe-area-inset-bottom, 0px)); min-height: 60vh; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs .row { max-width: var(--col); margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tab { background: none; border: 0; padding: 8px 2px 9px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--ink-2); position: relative; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--sea); }
.tab[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--sea); }
.tab .badge { position: absolute; top: 4px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff; font-size: 11px; line-height: 18px; font-weight: 700; }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 14px; padding: 13px 20px; font-weight: 800; font-size: 16px; letter-spacing: .02em; text-transform: uppercase; background: var(--sea); color: #fff; box-shadow: 0 4px 0 var(--sea-deep); transition: transform .08s, box-shadow .08s, filter .15s; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--sea-deep); }
.btn.block { width: 100%; }
.btn.good { background: var(--good); box-shadow: 0 4px 0 var(--good-deep); }
.btn.bad { background: var(--bad); box-shadow: 0 4px 0 var(--bad-deep); }
.btn.red { background: var(--red); box-shadow: 0 4px 0 var(--red-deep); }
.btn.ghost { background: var(--surface); color: var(--sea); box-shadow: 0 3px 0 var(--line); border: 2px solid var(--line); }
.btn.ghost:active { box-shadow: 0 0 0 var(--line); }
.btn[disabled] { background: var(--lock); color: var(--ink-2); box-shadow: 0 4px 0 var(--lock-deep); cursor: default; transform: none; }
.btn.small { padding: 9px 14px; font-size: 13px; border-radius: 12px; }
.linkbtn { background: none; border: 0; color: var(--sea); font-weight: 700; padding: 6px 4px; text-decoration: underline; text-underline-offset: 3px; }

.spk { width: 44px; height: 44px; flex: none; border-radius: 12px; border: 0; display: inline-grid; place-items: center; background: var(--sea); color: #fff; box-shadow: 0 3px 0 var(--sea-deep); }
.spk svg { width: 22px; height: 22px; }
.spk:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--sea-deep); }
.spk.slow { background: var(--surface); color: var(--sea); border: 2px solid var(--line); box-shadow: 0 3px 0 var(--line); }
.spk.mini { width: 34px; height: 34px; border-radius: 10px; box-shadow: 0 2px 0 var(--sea-deep); }
.spk.mini svg { width: 18px; height: 18px; }
.spk.flat { background: transparent; color: var(--sea); box-shadow: none; width: 36px; height: 36px; }
.spk[hidden] { display: none !important; }

/* ---------- Home ---------- */
.hello { margin-top: 18px; display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
.hello .mascot { width: 84px; height: 84px; }
.bubble { position: relative; background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 12px 14px; min-width: 0; }
.bubble::before { content: ""; position: absolute; left: -10px; top: 28px; width: 16px; height: 16px; background: var(--surface); border-left: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: rotate(45deg); }
.bubble h2 { font-size: 22px; }
.bubble p { margin: 2px 0 0; color: var(--ink-2); font-size: 14px; }
.today { margin-top: 14px; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px; display: grid; gap: 12px; }
.goalbar { height: 14px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.goalbar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--sun), color-mix(in srgb, var(--sun) 70%, var(--red))); transition: width .6s; }
.today .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 14px; }
.today .row b { font-variant-numeric: tabular-nums; }
.wotd { display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin-top: 12px; border-radius: var(--r); border: 2px dashed var(--line); }
.wotd .lbl { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.wotd .w { font-family: var(--f-display); font-weight: 700; font-size: 20px; line-height: 1.1; }
.wotd .d { color: var(--ink-2); font-size: 14px; }
.wotd > div { flex: 1; min-width: 0; }

/* Unit band */
.unit { margin-top: 30px; }
.unit-head { position: relative; border-radius: var(--r); color: #fff; padding: 16px 16px 16px 26px; overflow: hidden; box-shadow: 0 4px 0 rgba(0,0,0,.18); }
.unit-head::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 12px; background: conic-gradient(rgba(255,255,255,.95) 25%, transparent 0 50%, rgba(255,255,255,.95) 0 75%, transparent 0) 0 0 / 12px 12px; }
.unit-head .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; opacity: .9; }
.unit-head h3 { font-size: 24px; margin: 2px 0 4px; }
.unit-head p { margin: 0; font-size: 14px; opacity: .92; max-width: 40ch; }
.unit-head .prog { margin-top: 10px; display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
.unit-head .prog span { flex: 1; height: 8px; border-radius: 9px; background: rgba(255,255,255,.28); overflow: hidden; }
.unit-head .prog span i { display: block; height: 100%; background: #fff; border-radius: 9px; }

.path { position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 44px 0 6px; }
.node { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: 0; padding: 0; width: 132px; }
.node .disc { position: relative; width: 70px; height: 70px; border-radius: 50%; display: grid; place-items: center; background: var(--lock); box-shadow: 0 6px 0 var(--lock-deep); color: var(--ink-2); transition: transform .1s; }
.node:active .disc { transform: translateY(4px); box-shadow: 0 2px 0 var(--lock-deep); }
.node .disc svg { width: 30px; height: 30px; }
.node .cap { font-size: 13px; font-weight: 700; line-height: 1.2; text-align: center; color: var(--ink-2); max-width: 132px; }
.node.done .cap, .node.cur .cap { color: var(--ink); }
.node.done .disc, .node.cur .disc { color: #fff; }
.node .stars { position: absolute; bottom: -8px; display: flex; gap: 1px; }
.node .stars svg { width: 15px; height: 15px; }
.node.cur { margin-top: 30px; }
.node.cur .disc::after { content: ""; position: absolute; inset: -9px; border-radius: 50%; border: 4px solid var(--uc, var(--sea)); opacity: .35; animation: pulse 1.8s ease-out infinite; }
.node .go { position: absolute; top: -34px; background: var(--surface); color: var(--uc, var(--sea)); border: 2px solid var(--line); font-weight: 800; font-size: 13px; letter-spacing: .06em; padding: 3px 12px; border-radius: 10px; white-space: nowrap; animation: bob 2s ease-in-out infinite; }
.node .go::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 10px; height: 10px; background: var(--surface); border-right: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: translateX(-50%) rotate(45deg); }
@keyframes pulse { 0% { transform: scale(.9); opacity: .5; } 100% { transform: scale(1.25); opacity: 0; } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
.wave { display: block; width: 100%; height: 18px; margin-top: 18px; color: var(--line); }
.allset { text-align: center; margin: 34px 0 10px; color: var(--ink-2); }

/* ---------- Generic panels ---------- */
.page-title { margin: 20px 0 6px; font-size: 28px; }
.lede { color: var(--ink-2); margin-bottom: 14px; }
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; }
.stack { display: grid; gap: 12px; }
.hero-card { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
.hero-card .mascot { width: 72px; height: 72px; }
.big-num { font-family: var(--f-display); font-size: 40px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.list-btn { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; box-shadow: 0 3px 0 var(--line); }
.list-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.list-btn .ico { width: 40px; height: 40px; flex: none; border-radius: 12px; display: grid; place-items: center; color: #fff; }
.list-btn .ico svg { width: 22px; height: 22px; }
.list-btn .txt { flex: 1; min-width: 0; }
.list-btn .txt b { display: block; }
.list-btn .txt small { color: var(--ink-2); font-size: 13px; }
.list-btn .chev { color: var(--ink-2); display: grid; }
.list-btn .chev svg { width: 20px; height: 20px; }
.list-btn[disabled] { opacity: .55; cursor: default; }
.empty { text-align: center; padding: 26px 10px; color: var(--ink-2); }
.empty .mascot { width: 90px; height: 90px; margin: 0 auto 8px; display: block; }

/* Words */
.search { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 57px); z-index: 10; background: var(--bg); padding: 10px 0; display: grid; gap: 10px; }
.search input { width: 100%; font: inherit; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg-row { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.seg button { border: 2px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
.seg button[aria-pressed="true"] { border-color: var(--sea); background: var(--sea-soft); color: var(--sea); }
.wgroup h4 { font-size: 15px; margin: 18px 0 6px; color: var(--ink-2); font-family: var(--f-body); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.wrow { display: grid; grid-template-columns: 10px 1fr auto; gap: 12px; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--line); }
.wrow .t { min-width: 0; }
.wrow .t b { font-family: var(--f-display); font-weight: 600; font-size: 18px; display: block; line-height: 1.2; }
.wrow .t span { color: var(--ink-2); font-size: 14px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.dot.l1 { background: var(--sun); } .dot.l2 { background: var(--good); } .dot.l3 { background: var(--good-deep); }
.more-row { text-align: center; padding: 14px; }

/* Grammar / rich text */
.rich table { border-collapse: collapse; margin: 8px 0 12px; font-size: 14px; }
.rich th, .rich td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
.rich th { background: var(--surface-2); font-weight: 700; }
.rich h4 { font-size: 18px; margin: 14px 0 6px; }
.tblwrap { overflow-x: auto; max-width: 100%; }
.ru-box { margin-top: 12px; border-radius: 14px; background: var(--ru-soft); padding: 12px 14px; font-size: 15px; }
.ru-box .h { display: flex; align-items: center; gap: 6px; font-weight: 800; color: var(--ru); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 4px; }

/* Profile */
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 12px; display: flex; gap: 10px; align-items: center; }
.stat svg { width: 26px; height: 26px; flex: none; }
.stat b { display: block; font-family: var(--f-display); font-size: 22px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat small { color: var(--ink-2); font-size: 12px; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.cal .dh { font-size: 11px; color: var(--ink-2); text-align: center; font-weight: 700; }
.cal i { aspect-ratio: 1; border-radius: 6px; background: var(--surface-2); max-width: 100%; }
.cal i.x1 { background: color-mix(in srgb, var(--sun) 40%, var(--surface-2)); }
.cal i.x2 { background: color-mix(in srgb, var(--sun) 75%, var(--surface-2)); }
.cal i.x3 { background: var(--sun); }
.cal i.today { outline: 2px solid var(--ink); outline-offset: 1px; }
.cal i.fut { background: transparent; border: 1px dashed var(--line); }
.set { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.set:last-child { border-bottom: 0; }
.set > div { min-width: 0; }
.set small { display: block; color: var(--ink-2); font-size: 13px; }
.switch { position: relative; width: 52px; height: 30px; flex: none; border-radius: 99px; border: 0; background: var(--lock); transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s; }
.switch[aria-checked="true"] { background: var(--good); }
.switch[aria-checked="true"]::after { transform: translateX(22px); }
textarea.code { width: 100%; min-height: 110px; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; border-radius: 12px; border: 2px solid var(--line); background: var(--surface-2); color: var(--ink); padding: 10px; word-break: break-all; }
.field { width: 100%; font: inherit; font-size: 17px; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); }
.choice-row { display: flex; gap: 8px; flex-wrap: wrap; }
.choice { border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 14px; font-weight: 700; box-shadow: 0 3px 0 var(--line); text-align: left; }
.choice small { display: block; font-weight: 500; color: var(--ink-2); font-size: 12px; }
.choice[aria-pressed="true"] { border-color: var(--sea); background: var(--sea-soft); color: var(--sea); box-shadow: 0 3px 0 var(--sea); }
.note { font-size: 13px; color: var(--ink-2); }

/* ---------- Sheet ---------- */
#sheet { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
#sheet .scrim { position: absolute; inset: 0; background: rgba(8, 20, 28, .45); animation: fade .2s; }
#sheet .panel { position: relative; width: 100%; max-width: var(--col); max-height: 86vh; overflow: auto; background: var(--surface); border-radius: 22px 22px 0 0; padding: 20px max(18px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); animation: up .25s cubic-bezier(.2,.9,.3,1.1); }
#sheet .x { position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; border-radius: 10px; border: 0; background: var(--surface-2); display: grid; place-items: center; }
#sheet h3 { font-size: 24px; margin: 0 40px 6px 0; }

.prompt .say { position: relative; flex: 1; min-width: 0; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; }

/* Intro card */

/* Gap */

.gap-sent .blank { display: inline-block; min-width: 90px; border-bottom: 3px solid var(--sea); text-align: center; color: var(--sea); padding: 0 6px; }

.gap-sent .blank.wrong { color: var(--bad); border-color: var(--bad); }

.opts.row { grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); }
.opts.row .opt { justify-content: center; text-align: center; }

.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.end-stats b { display: block; font-family: var(--f-display); font-size: 24px; padding: 8px 4px; font-variant-numeric: tabular-nums; }

#onboard { position: fixed; inset: 0; z-index: 70; background: var(--bg); overflow-y: auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.ob { max-width: 480px; margin: 0 auto; padding: 26px max(18px, env(safe-area-inset-right, 0px)) 30px max(18px, env(safe-area-inset-left, 0px)); display: grid; gap: 18px; }
.ob .mascot { width: 120px; height: 120px; margin: 0 auto; display: block; }

.ob .checker { height: 10px; border-radius: 3px; background: conic-gradient(var(--red) 25%, #fff 0 50%, var(--red) 0 75%, #fff 0) 0 0 / 10px 10px; box-shadow: inset 0 0 0 1px var(--red); }

#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 80; width: 100%; height: 100%; }

@media (prefers-reduced-motion: reduce) {

}

}

.resume { margin-top: 14px; display: flex; align-items: center; gap: 12px; background: var(--surface); border: 2px solid var(--sea); border-radius: var(--r); padding: 12px 14px; box-shadow: 0 3px 0 var(--sea); }

/* ===== Lernstoff Teil 1: Aussprache, Einheit 1–3 =====
   Format einer Lektion:

   {m|f} = Form für Mann | Frau,  {NAME} = Name der lernenden Person */
const UNITS = [];

UNITS.push({
  id: "u0", lvl: "A1", t: "Aussprache", d: "So klingt Kroatisch – jeder Buchstabe hat genau einen Laut.", c: 0,
  L: [
    { id: "a1", t: "Buchstaben & Laute",
      w: [["čovjek","Mensch"],["kuća","Haus"],["šuma","Wald"],["žena","Frau"],["džep","Hosentasche"],["anđeo","Engel"],["ljubav","Liebe"],["njemački","Deutsch (Sprache)"],["cijena","Preis"],["hrana","Essen / Nahrung"],["more","Meer"]],
      s: [],
      g: `<p>Gute Nachricht: Kroatisch spricht man <b>genau so, wie man es schreibt</b>. Jeder Buchstabe hat immer denselben Laut.</p>
<table><tr><th>Buchstabe</th><th>klingt wie</th><th>Beispiel</th></tr>
<tr><td><b>c</b></td><td>z in <i>Zeit</i></td><td>cijena</td></tr>
<tr><td><b>č</b></td><td>hartes tsch (<i>Tschüss</i>)</td><td>čovjek</td></tr>
<tr><td><b>ć</b></td><td>weiches tsch, fast „tj“</td><td>kuća</td></tr>
<tr><td><b>dž</b></td><td>hartes dsch (<i>Dschungel</i>)</td><td>džep</td></tr>
<tr><td><b>đ</b></td><td>weiches dsch, fast „dj“</td><td>anđeo</td></tr>
<tr><td><b>š</b></td><td>sch (<i>Schule</i>)</td><td>šuma</td></tr>
<tr><td><b>ž</b></td><td>weiches sch (<i>Garage</i>)</td><td>žena</td></tr>
<tr><td><b>s</b></td><td>immer scharf wie ß</td><td>sok</td></tr>
<tr><td><b>z</b></td><td>weiches s (<i>Sonne</i>)</td><td>zima</td></tr>
<tr><td><b>v</b></td><td>w (<i>Wasser</i>)</td><td>voda</td></tr>
<tr><td><b>h</b></td><td>ch wie in <i>Bach</i></td><td>hrana</td></tr>
<tr><td><b>j</b></td><td>j wie in <i>ja</i></td><td>jaje</td></tr>
<tr><td><b>lj</b></td><td>weiches lj, ein Laut</td><td>ljubav</td></tr>
<tr><td><b>nj</b></td><td>wie gn in <i>Champagner</i></td><td>njemački</td></tr>
<tr><td><b>r</b></td><td>gerolltes Zungen-r</td><td>more</td></tr></table>
<p>Tipp: Wenn du zuerst unsicher bist zwischen <b>č</b> und <b>ć</b> – die Kroaten selbst verwechseln sie im Alltag auch manchmal. Hauptsache, du sagst überhaupt „tsch“.</p>`,
      ru: `Die Sonderzeichen sind fast Eins-zu-eins Kyrillisch: <b>š</b> = ш, <b>ž</b> = ж, <b>c</b> = ц, <b>h</b> = х, <b>j</b> = й, <b>lj</b> = ль, <b>nj</b> = нь, <b>dž</b> = дж. Das russische <b>ч</b> ist weich – es liegt näher am kroatischen <b>ć</b>; das kroatische <b>č</b> ist härter.`,
      x: [["___ovjek","č",["ć","c"],"Mensch"],["ku___a","ć",["č","c"],"Haus"],["___ena","ž",["š","z"],"Frau"],["___uma","š",["s","ž"],"Wald"],["___ijena","c",["č","z"],"Preis"],["an___eo","đ",["dž","d"],"Engel"]]
    },
    { id: "a2", t: "Typisch kroatische Laute",
      w: [["vrt","Garten"],["prst","Finger"],["vrh","Gipfel"],["prvi","erster"],["brdo","Hügel / Berg"],["svijet","Welt"],["lijepo","schön"],["tijelo","Körper"],["dijete","Kind"],["rijeka","Fluss"],["brzo","schnell"]],
      s: [["Lijepo vrijeme!","Schönes Wetter!"],["Brzo, brzo!","Schnell, schnell!"]],
      g: `<p><b>Das r kann ein Vokal sein.</b> In Wörtern wie <b>vrt</b>, <b>prst</b>, <b>vrh</b> oder <b>brdo</b> trägt das gerollte r die Silbe. Sprich einfach ein kurzes, kräftiges „rr“ zwischen den Konsonanten: <i>v-rr-t</i>, <i>b-rr-do</i>.</p>
<p><b>ije</b> spricht man wie ein langes „je“: <b>mlijeko</b> = „mlje-ko“, <b>lijepo</b> = „lje-po“. Das ist typisch fürs Kroatische (in Serbien sagt man <i>mleko, lepo</i>).</p>
<p>Die Betonung liegt meistens auf der <b>ersten Silbe</b>, nie auf der letzten. Vokale werden immer klar ausgesprochen – auch unbetont.</p>`,
      ru: `Anders als im Russischen werden unbetonte Vokale <b>nicht reduziert</b>: <b>dobro</b> klingt wirklich „do-bro“, nicht „дабра“. Und <b>ije</b> entspricht oft dem russischen е: svijet ≈ свет, vrijeme ≈ время, rijeka ≈ река, snijeg ≈ снег.`,
      x: [["sv___et","ij",["je","e"],"Welt"],["v___t","r",["e","a"],"Garten"],["l___epo","ij",["e","je"],"schön"]]
    }
  ]
});

UNITS.push({
  id: "u1", lvl: "A1", t: "Erste Schritte", d: "Grüßen, fragen, sich vorstellen – die ersten Sätze für echte Gespräche.", c: 1,
  L: [
    { id: "b1", t: "Hallo & Tschüss",
      w: [["Bok!","Hallo! / Tschüss!"],["Dobar dan!","Guten Tag!"],["Dobro jutro!","Guten Morgen!"],["Dobra večer!","Guten Abend!"],["Laku noć!","Gute Nacht!"],["Doviđenja!","Auf Wiedersehen!"],["Vidimo se!","Wir sehen uns!"],["hvala","danke"],["molim","bitte"],["da","ja"],["ne","nein / nicht"]],
      s: [["Bok, Ana!","Hallo, Ana!"],["Dobar dan, gospodine!","Guten Tag, mein Herr!"],["Hvala, bok!","Danke, tschüss!"],["Dobro jutro, mama!","Guten Morgen, Mama!"],["Laku noć i hvala!","Gute Nacht und danke!"]],
      g: `<p><b>Bok</b> ist locker – für Freunde, Familie, Gleichaltrige. Es heißt Hallo <i>und</i> Tschüss.</p>
<p><b>Dobar dan</b> ist höflich: im Laden, bei Älteren, bei Fremden. Man sagt es schon ab dem späten Vormittag.</p>
<p>Schau dir die Endungen an: <b>dobar</b> dan · <b>dobro</b> jutro · <b>dobra</b> večer. „Gut“ passt sich an, ob das Wort männlich (dan), sächlich (jutro) oder weiblich (večer) ist. Das lernst du später genauer – hier einfach als feste Ausdrücke merken.</p>`,
      ru: `Dobar dan ≈ добрый день, dobro jutro ≈ доброе утро. <b>Laku noć</b> heißt wörtlich „leichte Nacht“ (≈ спокойной ночи). <b>Hvala</b> kennst du als хвала (Lob).`,
      d: [["A","Bok, Marko!","Hallo, Marko!"],["B","Bok, Ana! Dobro jutro!","Hallo, Ana! Guten Morgen!"],["A","Dobro jutro! Vidimo se!","Guten Morgen! Bis später!"],["B","Bok!","Tschüss!"]],

      x: [["Dobro ___!","jutro",["dan","noć"],"Guten Morgen!"],["___ dan!","Dobar",["Dobro","Dobra"],"Guten Tag!"],["Laku ___!","noć",["večer","jutro"],"Gute Nacht!"],["Dobra ___!","večer",["jutro","dan"],"Guten Abend!"]]
    },
    { id: "b2", t: "Wie geht's?",
      w: [["Kako si?","Wie geht's dir?"],["Kako ste?","Wie geht es Ihnen?"],["Dobro sam.","Mir geht's gut."],["Odlično!","Ausgezeichnet!"],["Nije loše.","Nicht schlecht."],["Onako.","So lala."],["Loše.","Schlecht."],["A ti?","Und du?"],["I ja.","Ich auch."],["Hvala na pitanju.","Danke der Nachfrage."]],
      s: [["Bok! Kako si?","Hallo! Wie geht's dir?"],["Dobro sam, hvala. A ti?","Mir geht's gut, danke. Und dir?"],["Odlično sam!","Mir geht's ausgezeichnet!"],["Dobar dan! Kako ste?","Guten Tag! Wie geht es Ihnen?"],["Nisam dobro.","Mir geht es nicht gut."]],
      g: `<p><b>ti</b> = du → <b>Kako si?</b><br><b>vi</b> = Sie (und ihr) → <b>Kako ste?</b></p>
<p><b>sam</b> heißt „ich bin“. <i>Dobro sam</i> = wörtlich „gut bin ich“. Dieses kleine Wort steht fast nie am Satzanfang, es rutscht an die <b>zweite Stelle</b>.</p>
<p>Verneinung in einem Wort: <b>nisam</b> = ich bin nicht. <i>Nisam dobro</i> = Mir geht's nicht gut.</p>`,
      ru: `Statt „Как дела?“ fragt man direkt nach der Person: <b>Kako si?</b> (wörtlich „wie bist du?“). Und „sein“ fällt im Präsens <b>nie</b> weg: <i>Dobro sam</i>, nicht nur „dobro“.`,
      d: [["A","Dobar dan, gospođo Horvat! Kako ste?","Guten Tag, Frau Horvat! Wie geht es Ihnen?"],["B","Dobro, hvala na pitanju. A vi?","Gut, danke der Nachfrage. Und Ihnen?"],["A","Nije loše, hvala.","Nicht schlecht, danke."]],
      dq: ["Wie geht es Frau Horvat?","Gut",["Schlecht","So lala"]],

    },

      s: [["Zovem se {NAME}.","Ich heiße {NAME}.",["Ja se zovem {NAME}."]],["Drago mi je, ja sam Marko.","Freut mich, ich bin Marko."],["Ja sam iz Njemačke.","Ich bin aus Deutschland.",["Iz Njemačke sam ja."]],["Živim u Njemačkoj.","Ich wohne in Deutschland.",["U Njemačkoj živim."]],["Odakle si ti?","Woher kommst du?"],["Kako se zovete?","Wie heißen Sie?"]],
      g: `<p><b>zvati se</b> = heißen (wörtlich „sich rufen“): <i>Zovem se Ana</i> oder <i>Ja se zovem Ana</i>. Das <b>se</b> steht an zweiter Stelle.</p>

<p>Merk dir die Formen erstmal als feste Ausdrücke – die Fälle kommen später Schritt für Schritt.</p>`,
      ru: `<b>Zovem se</b> ≈ меня зовут, nur als „ich rufe mich“. <b>Iz Njemačke</b> ≈ из Германии – derselbe Genitiv nach „aus“, sogar die Endung -e passt zu -и.`,

      dq: ["Woher kommt Luka?","Aus Split",["Aus Deutschland","Aus Zagreb"]],

    { id: "b4", t: "Höflich sein",

      g: `<p><b>Molim</b> ist ein Alleskönner: „bitte“ beim Bitten, „Wie bitte?“ wenn man etwas nicht verstanden hat, und „gern geschehen“ als Antwort auf <i>hvala</i>.</p>

      ru: `Molim ≈ молю (ich bitte), Oprostite ≈ простите, Žao mi je ≈ жаль (wörtlich „leid ist mir“).`,
      d: [["A","Oprostite, je li ovo mjesto slobodno?","Entschuldigung, ist dieser Platz frei?"],["B","Da, slobodno je. Izvolite.","Ja, er ist frei. Bitte."],["A","Hvala lijepa!","Vielen Dank!"],["B","Nema na čemu.","Gern geschehen."]],

    { id: "b5", t: "Wenn du nichts verstehst",
      w: [["Ne razumijem.","Ich verstehe nicht."],["Ne znam.","Ich weiß nicht."],["Govoriš li njemački?","Sprichst du Deutsch?"],["Govorite li engleski?","Sprechen Sie Englisch?"],["Malo govorim hrvatski.","Ich spreche ein bisschen Kroatisch."],["Polako, molim.","Langsam, bitte."],["Možete li ponoviti?","Können Sie das wiederholen?"],["Što to znači?","Was bedeutet das?"],["Kako se kaže … na hrvatskom?","Wie sagt man … auf Kroatisch?"],["Učim hrvatski.","Ich lerne Kroatisch."]],
      s: [["Ne razumijem, polako molim.","Ich verstehe nicht, langsam bitte."],["Ja učim hrvatski.","Ich lerne Kroatisch.",["Učim hrvatski."]],["Govoriš li engleski?","Sprichst du Englisch?"],["Ne znam što to znači.","Ich weiß nicht, was das bedeutet."],["Možete li ponoviti, molim vas?","Können Sie das bitte wiederholen?"]],
      g: `<p>Ja/Nein-Fragen baust du mit <b>li</b>: das Verb nach vorne, <b>li</b> direkt dahinter.<br><i>Govoriš hrvatski.</i> → <b>Govoriš li</b> hrvatski?</p>

      ru: `govoriti ≈ говорить, znati ≈ знать, razumjeti ≈ понимать (verwandt mit разум). Die li-Frage kennst du: „Говоришь ли ты…?“ – im Kroatischen ist sie ganz normal.`,
      d: [["A","Dobar dan! Izvolite?","Guten Tag! Was darf's sein?"],["B","Oprostite, ne razumijem. Govorite li engleski?","Entschuldigung, ich verstehe nicht. Sprechen Sie Englisch?"],["A","Malo. A vi govorite hrvatski?","Ein bisschen. Und Sie sprechen Kroatisch?"],["B","Malo. Učim hrvatski!","Ein bisschen. Ich lerne Kroatisch!"]],

      g: `<p><b>Eins</b> und <b>zwei</b> passen sich ans Geschlecht an:<br><b>jedan</b> čaj (m) · <b>jedna</b> kava (f) · <b>jedno</b> pivo (n)<br><b>dva</b> čaja (m/n) · <b>dvije</b> kave (f)</p>

    { id: "b7", t: "Ich bin, du bist",

      s: [["Ja sam student{|ica}.","Ich bin Student{|in}.",["Student{|ica} sam."]],["Ona je iz Hrvatske.","Sie ist aus Kroatien."],["Mi smo prijatelji.","Wir sind Freunde."],["Jeste li vi iz Njemačke?","Sind Sie aus Deutschland?"],["On nije ovdje.","Er ist nicht hier."],["Umor{an|na} sam.","Ich bin müde."]],
      g: `<p><b>biti</b> (sein) im Präsens:</p>

    { id: "b8", t: "Fragewörter",

      g: `<p>Im Kroatischen heißt es <b>tko</b> (wer) und <b>što</b> (was). In Serbien und Bosnien hörst du <i>ko</i> und <i>šta</i> – verstehen tut man beides.</p>

      s: [["Jučer sam {bio|bila} na moru.","Gestern war ich am Meer.",["{Bio|Bila} sam jučer na moru."]],["Gdje si bila?","Wo warst du? (zu einer Frau)"],["Prošle godine smo bili u Splitu.","Letztes Jahr waren wir in Split.",["Bili smo u Splitu prošle godine."]],["Nisam {imao|imala} vremena.","Ich hatte keine Zeit."],["Je li bilo hladno?","War es kalt?"]],

      ru: `Fast wie Russisch: был/была → <b>bio/bila</b>. Kroatisch braucht aber zusätzlich sam/si/je: я была → <b>bila sam</b>. Das russische -л wird am Wortende zu -o: был → bio, мог → mogao.`,
      d: [["A","Gdje si bila prošli tjedan?","Wo warst du letzte Woche?"],["B","Bila sam u Dubrovniku s mamom.","Ich war mit Mama in Dubrovnik."],["A","Super! Kako je bilo?","Super! Wie war's?"],["B","Prekrasno, ali jako vruće!","Wunderschön, aber sehr heiß!"]],

      x: [["Jučer ___ bila na moru.","sam",["si","je"],"Gestern war ich am Meer."],["Gdje si ___? (zu einer Frau)","bila",["bio","bili"],"Wo warst du?"],["Mi smo ___ u Splitu.","bili",["bio","bila"],"Wir waren in Split."],["Nisam ___ vremena. (Mann)","imao",["imala","imam"],"Ich hatte keine Zeit."],["___ je super!","Bilo",["Bio","Bila"],"Es war super!"]]

    { id: "g2", t: "Was hast du gemacht?",

      g: `<p>Partizip: Infinitiv ohne <b>-ti</b>, dann <b>-o</b> (Mann) oder <b>-la</b> (Frau):<br>gleda-ti → gleda<b>o</b> / gleda<b>la</b> · radi-ti → radi<b>o</b> / radi<b>la</b> · vidje-ti → vidi<b>o</b> / vidje<b>la</b></p>
<p>Unregelmäßig: jesti → <b>jeo/jela</b>, ići → <b>išao/išla</b>, reći → <b>rekao/rekla</b>, doći → <b>došao/došla</b>.</p>
<p>Fragen: <b>Jesi li…?</b> · <b>Što si…?</b></p>`,
      ru: `Kroatisch benutzt im Alltag (fast) nur diese eine Vergangenheit – wie Russisch. смотрела → gledala, ела → jela, пила → pila, видела → vidjela.`,
      d: [["A","Što si radila za vikend?","Was hast du am Wochenende gemacht?"],["B","U subotu sam bila na plaži, a u nedjelju sam spavala cijeli dan.","Am Samstag war ich am Strand und am Sonntag habe ich den ganzen Tag geschlafen."],["A","Pametno!","Klug!"]],
      dq: ["Was hat B am Sonntag gemacht?","Den ganzen Tag geschlafen",["Am Strand gewesen","Gearbeitet"]],
      x: [["{Gledao|Gledala} ___ film.","sam",["si","je"],"Ich habe einen Film geschaut."],["Jesi ___ vidjela more?","li",["se","je"],"Hast du das Meer gesehen?"],["Ona je ___ kavu.","pila",["pio","pili"],"Sie hat Kaffee getrunken."],["On je ___ kući.","išao",["išla","ide"],"Er ist nach Hause gegangen."]]
    },
    { id: "g3", t: "Ich werde (Futur)",

      s: [["Sutra ću raditi.","Morgen werde ich arbeiten."],["Radit ću sutra.","Ich werde morgen arbeiten."],["Što ćeš raditi za vikend?","Was wirst du am Wochenende machen?"],["Hoćeš li doći?","Wirst du kommen?"],["Neću zaboraviti.","Ich werde es nicht vergessen."]],
      g: `<p>Futur = <b>ću/ćeš/će/ćemo/ćete/će</b> + Infinitiv.</p>
<p>Steht das Verb vorne, fällt das <b>-i</b> weg und man schreibt getrennt: <b>radit ću</b>, <b>vidjet ćemo</b>. Aber bei -ći bleibt alles: <b>ići ću</b>, <b>doći ću</b>.</p>
<p>Frage: <b>Hoćeš li…?</b> · Verneint: <b>neću, nećeš…</b></p>
<p><b>Vidjet ćemo</b> („Mal sehen“) ist eine typisch kroatische Antwort auf alles.</p>`,
      ru: `ću ≈ хочу – das Futur kommt von „wollen“ (wie das englische will). буду работать → <b>radit ću</b>.`,
      d: [["A","Što ćeš raditi sutra?","Was machst du morgen?"],["B","Ići ću u Zagreb. Imam ispit.","Ich fahre nach Zagreb. Ich habe eine Prüfung."],["A","Sretno! Javit ćeš mi kako je bilo?","Viel Glück! Sagst du mir, wie es war?"],["B","Hoću, naravno!","Mach ich, klar!"]],
      dq: ["Warum fährt B nach Zagreb?","Wegen einer Prüfung",["Zum Arbeiten","Zum Einkaufen"]],
      x: [["Sutra ___ raditi.","ću",["ćeš","će"],"Morgen werde ich arbeiten."],["Što ___ raditi? (du)","ćeš",["ću","ćemo"],"Was wirst du machen?"],["___ li doći?","Hoćeš",["Ćeš","Hoću"],"Wirst du kommen?"],["Vidjet ___.","ćemo",["ću","će"],"Wir werden sehen."]]

    { id: "g4", t: "Schon, noch, gleich",
      w: [["prije dva dana","vor zwei Tagen"],["za tjedan dana","in einer Woche"],["sljedeće godine","nächstes Jahr"],["upravo","gerade eben"],["još ne","noch nicht"],["tek","erst"],["kasnije","später"],["poslije","danach"],["odmah","sofort"],["nedavno","kürzlich"]],

      ru: `poslije ≈ после, već ≈ уже, još ≈ ещё, odmah ≈ сразу. prije ≈ прежде.`,
      x: [["Još ___ jela.","nisam",["sam","nije"],"Ich habe noch nicht gegessen."],["Prije dva ___.","dana",["dan","dani"],"Vor zwei Tagen."],["Za pet ___.","minuta",["minute","minutu"],"In fünf Minuten."],["Čujemo se ___!","kasnije",["prije","već"],"Wir hören uns später!"]]

    { id: "g5", t: "Verbalaspekt",
      w: [["pisati / napisati","schreiben (dabei / fertig)"],["čitati / pročitati","lesen / durchlesen"],["jesti / pojesti","essen / aufessen"],["piti / popiti","trinken / austrinken"],["kupovati / kupiti","einkaufen / kaufen (einmal)"],["gledati / pogledati","schauen / sich ansehen"],["dolaziti / doći","kommen (oft / einmal)"],["učiti / naučiti","lernen / gelernt haben"]],
      s: [["{Pročitao|Pročitala} sam knjigu.","Ich habe das Buch (fertig) gelesen."],["{Čitao|Čitala} sam cijelu večer.","Ich habe den ganzen Abend gelesen."],["Popij kavu!","Trink deinen Kaffee aus!"],["Svaki dan pijem kavu.","Ich trinke jeden Tag Kaffee."],["Sutra ću kupiti kartu.","Morgen kaufe ich das Ticket."],["Naučit ću hrvatski!","Ich werde Kroatisch lernen (und es können)!"]],
      g: `<p>Fast jedes Verb gibt es doppelt:</p>

      ru: `Das kennst du perfekt! Genau wie читать/прочитать, писать/написать, пить/выпить (→ popiti), учить/выучить (→ naučiti). Hier hast du einen riesigen Vorteil gegenüber Deutschen.`,
      x: [["Svaki dan ___ kavu.","pijem",["popijem","popila"],"Ich trinke jeden Tag Kaffee."],["Jesi li ___ knjigu? (fertig)","pročitala",["čitala","čitam"],"Hast du das Buch zu Ende gelesen?"],["Sutra ću ___ kartu.","kupiti",["kupovati","kupujem"],"Morgen kaufe ich das Ticket."]]

      ru: `Boli me glava ≈ у меня болит голова (nur mit me = „mich“). lijek ist verwandt mit лечить, bolestan ≈ болен.`,
      d: [["A","Dobar dan, što vas muči?","Guten Tag, was fehlt Ihnen?"],["B","Boli me grlo i imam temperaturu.","Ich habe Halsschmerzen und Fieber."],["A","Od kada?","Seit wann?"],["B","Od jučer.","Seit gestern."]],

      s: [["{Sretan|Sretna} sam!","Ich bin glücklich!"],["Zašto si tužna?","Warum bist du traurig? (zu einer Frau)"],["Malo sam {umoran|umorna}.","Ich bin ein bisschen müde."],["Ne brini!","Mach dir keine Sorgen!"],["Ljuta je na mene.","Sie ist sauer auf mich."],["Jako se veselim!","Ich freue mich sehr!"]],

      x: [["Zašto si ___? (sie)","tužna",["tužan","tužno"],"Warum bist du traurig?"],["Dosadno ___ je.","mi",["me","sam"],"Mir ist langweilig."],["Kako se ___?","osjećaš",["osjećam","osjeća"],"Wie fühlst du dich?"],["Ljuta je na ___.","mene",["mi","ja"],"Sie ist sauer auf mich."]]

      g: `<p>Der Dativ antwortet auf <b>„wem?“</b>. Die Kurzformen (<b>mi, ti, mu, joj, nam, vam, im</b>) stehen an zweiter Stelle; die Langformen (<b>meni, tebi…</b>) betonen: <i>Meni se sviđa, a tebi?</i></p>

      ru: `Wie im Russischen: мне → meni/mi, тебе → tebi/ti, ему → njemu/mu, ей → njoj/joj, нам → nama/nam. Мне нужно такси ≈ Treba mi taksi.`,

const TTS = {

const typable = it => it.k === "w" && !/…|\.\.\./.test(it.hr) && res(it.hr).split(" / ")[0].split(/\s+/).length <= 3;
function answersHr(it) {

function wordEx(it, audio, bias) {
  const r = Math.random();
  if (typable(it) && r < .34) return { t: "type", it };
  if (audio && r < .62) return { t: "mc", dir: "listen", it };

  if (r < .45) return { t: "build", dir: "hr-de", it };

}
function buildLesson(L, practice) {
  const audio = TTS.ok;
  const words = L.items.filter(i => i.k === "w"), sents = L.items.filter(i => i.k === "s");
  const head = [];
  if (!practice) {
    if (L.g) head.push({ t: "tip", L });
    for (let c = 0; c < words.length; c += 3) {
      const ch = words.slice(c, c + 3);
      ch.forEach(w => head.push({ t: "intro", it: w }));
      shuffle(ch).forEach((w, i) => head.push({ t: "mc", dir: i % 2 ? "de-hr" : "hr-de", it: w }));
    }
  }
  const P = [];
  const ws = practice ? sample(words, Math.min(7, words.length)) : sample(words, Math.min(5, words.length));
  ws.forEach(w => P.push(wordEx(w, audio, .5)));
  if (words.length >= 4) P.push({ t: "match", pairs: sample(words, Math.min(5, words.length)) });
  const ss = practice ? sample(sents, Math.min(4, sents.length)) : sents;
  ss.forEach(s => P.push({ t: "build", dir: "de-hr", it: s }));
  if (sents.length) {
    P.push({ t: "build", dir: "hr-de", it: pick(sents) });
    if (audio) P.push({ t: "build", dir: "listen", it: pick(sents) });
  }
  sample(L.x || [], practice ? 3 : 4).forEach(x => P.push({ t: "gap", x, L }));
  let tail = shuffle(P);
  if (tail.length && tail[0].t === "match" && tail.length > 1) tail.push(tail.shift());

}

/* Ablenker für Multiple Choice */
function distractors(it, n, field) {
  const key = x => norm(field === "de" ? deClean(res(x.de)) : res(x.hr));
  const seen = new Set([key(it)]);
  const hrI = norm(res(it.hr)), deI = norm(deClean(res(it.de)));
  const u = it.L.u;
  const near = LESSONS.filter(L => Math.abs(L.gi - it.L.gi) <= 4).flatMap(L => L.items);
  const pools = [it.L.items, u.L.flatMap(l => l.items), near, ALL];
  const out = [];
  for (const pool of pools) {
    for (const c of shuffle(pool)) {
      if (out.length >= n) break;
      if (c.k !== it.k || c.id === it.id) continue;
      const k = key(c);
      if (seen.has(k) || norm(res(c.hr)) === hrI || norm(deClean(res(c.de))) === deI) continue;
      seen.add(k); out.push(c);
    }
    if (out.length >= n) break;
  }
  return out;
}
/* Ablenker-Kacheln für den Satzbau */
function tileDistractors(target, lang, it, count) {
  const tset = new Set(target.map(t => t.toLowerCase()));
  const src = it.L.u.L.flatMap(l => l.items).filter(x => x !== it);
  const pool = new Map();
  src.forEach(x => tokens(lang === "hr" ? res(x.hr) : deClean(res(x.de))).forEach(t => { const k = t.toLowerCase(); if (!tset.has(k)) pool.set(k, t); }));
  const cands = [...pool.values()];
  const sim = c => target.some(t => t.length > 2 && c.length > 2 && t.slice(0, 3).toLowerCase() === c.slice(0, 3).toLowerCase());
  const nearC = shuffle(cands.filter(sim)).slice(0, Math.ceil(count / 2));
  const rest = shuffle(cands.filter(c => !nearC.includes(c))).slice(0, count - nearC.length);
  return nearC.concat(rest);
}

/* Freie Wortstellung: erlaubte Umstellungen erkennen */
const CLITICS = new Set(["sam", "si", "je", "smo", "ste", "su", "ću", "ćeš", "će", "ćemo", "ćete", "bih", "bi", "bismo", "biste", "me", "te", "ga", "ju", "nas", "vas", "ih", "mi", "ti", "mu", "joj", "nam", "vam", "im", "se", "li"]);
const BINDERS = new Set(["u", "na", "s", "sa", "iz", "od", "do", "za", "kod", "bez", "pored", "ispred", "iza", "o", "po", "zbog", "prije", "poslije", "ne", "pa", "i", "a", "ali", "ili", "da", "jer", "ako", "kad", "iako", "koji", "koja", "koje", "moj", "moja", "moje", "moji", "tvoj", "tvoja", "tvoje", "naš", "naša", "naše", "vaš", "vaša", "njegov", "njegova", "njezin", "njezina", "ovaj", "ova", "taj", "ta", "svaki", "svaka", "jedan", "jedna", "jednu", "dva", "dvije", "tri", "pet", "deset", "puno", "malo", "jako", "vrlo", "pola", "glavni", "lijep", "lijepo", "crveni", "novu", "bijelu", "omiljena", "hrvatski", "prošle", "prošli", "sljedeće", "cijelu", "cijeli", "najbolju", "najljepša", "najljepši"]);
function permOK(user, target) {
  if (user.length !== target.length || user.length < 2) return false;
  if ([...user].sort().join(" ") !== [...target].sort().join(" ")) return false;
  if (CLITICS.has(target[0]) || CLITICS.has(user[0])) return false;
  const ci = a => a.map((t, i) => CLITICS.has(t) ? i : -1).filter(i => i >= 0);
  const uc = ci(user), tc = ci(target);
  if (uc.map(i => user[i]).join() !== tc.map(i => target[i]).join()) return false;
  for (let k = 1; k < uc.length; k++) if (uc[k] !== uc[k - 1] + 1) return false;
  if (uc.length && !(uc[0] === 1 || uc[0] === tc[0])) return false;
  const follow = a => { const m = {}; a.forEach((t, i) => { if (BINDERS.has(t)) (m[t] = m[t] || []).push(a[i + 1] || ""); }); Object.values(m).forEach(v => v.sort()); return JSON.stringify(Object.keys(m).sort().map(k => [k, m[k]])); };
  return follow(user) === follow(target);
}

function unpackRun(p) {

      if (e.L) { ex.L = LBYID[e.L]; if (!ex.L) throw 0; }
      if (e.x != null) { ex.x = ex.L && ex.L.x && ex.L.x[e.x]; if (!ex.x) throw 0; }
      if (e.pairs) { ex.pairs = e.pairs.map(id => ITEMS[id]); if (ex.pairs.some(x => !x)) throw 0; }

/* ---------- Ende einer Runde ---------- */
function finish() {
  const acc = R.tot ? Math.round(R.ok / R.tot * 100) : 100;
  const stars = acc >= 90 ? 3 : acc >= 70 ? 2 : 1;
  const secs = Math.round((Date.now() - R.t0) / 1000);
  const before = todayXP();
  let xp, title, sub;
  S.run = null;
  if (R.kind === "lesson") {
    const L = R.L, prev = S.lessons[L.id];
    xp = prev ? 6 + (acc === 100 ? 2 : 0) : 10 + (acc === 100 ? 5 : 0);
    L.items.forEach(learn);
    if (!prev) R.failed.forEach(id => { const r = S.items[id]; if (r) r.w = (r.w || 0) + 1; });
    S.lessons[L.id] = { d: 1, s: Math.max(stars, prev ? prev.s : 0), n: (prev ? prev.n : 0) + 1 };
  } else {
    xp = Math.max(3, Math.round(R.ok * .7));
  }
  addXP(xp);
  const savedOK = storageOK;
  askPersist();
  const goalNow = before < S.goal && before + xp >= S.goal;
  if (acc === 100) { title = "Savršeno!"; sub = "Perfekt – kein einziger Fehler."; }
  else if (acc >= 90) { title = "Odlično!"; sub = "Ausgezeichnet gemacht."; }
  else if (acc >= 70) { title = "Bravo!"; sub = "Gut gemacht – weiter so."; }
  else { title = "Dobro je!"; sub = "Gut so. Die Fehler kommen in die Wiederholung."; }
  if (R.kind !== "lesson") sub = "Wiederholung geschafft. " + sub;
  const mm = Math.floor(secs / 60), ss = secs % 60;
  const st = streak();
  const wrong = [...new Map(R.wrong.map(w => [w.id, w])).values()].slice(0, 8);
  const body = $("#lxb");
  $(".lx-prog i").style.width = "100%";
  body.innerHTML = `<div class="end">${mascot("wow")}<h2>${title}</h2><p class="sub">${sub}</p>
  ${R.kind === "lesson" ? `<div class="end-stars">${[1, 2, 3].map(n => `<span style="color:${n <= stars ? "var(--sun)" : "var(--lock)"}">${I.star}</span>`).join("")}</div>` : ""}
  <div class="end-stats"><div><small style="background:var(--sun)">XP</small><b>+${xp}</b></div><div><small style="background:var(--good)">Treffer</small><b>${acc}%</b></div><div><small style="background:var(--sea)">Zeit</small><b>${mm}:${pad(ss)}</b></div></div>
  <p class="saved-line ${savedOK ? "" : "bad"}">${savedOK ? I.check.replace("<svg", '<svg width="16" height="16"') + " Fortschritt gespeichert" : I.alert.replace("<svg", '<svg width="16" height="16"') + " Konnte nicht gespeichert werden – öffne mich über den Link in Safari oder Chrome."}</p>
  ${goalNow ? `<div class="card" style="display:flex;gap:12px;align-items:center;text-align:left;margin-bottom:12px"><span style="color:var(--sun);flex:none;display:block">${I.flame.replace("<svg", '<svg width="44" height="44"')}</span><div><b>Tagesziel geschafft!</b><br><span class="muted">${st} ${st === 1 ? "Tag" : "Tage"} in Folge. Sutra opet? (Morgen wieder?)</span></div></div>` : ""}
  ${wrong.length ? `<div class="card mistakes"><h4>Das übst du in der Wiederholung</h4>${wrong.map(w => `<div class="wrow" style="grid-template-columns:1fr auto"><div class="t"><b>${esc(res(w.hr))}</b><span>${esc(res(w.de))}</span></div>${spk(w.hr, false, "flat")}</div>`).join("")}</div>` : ""}
  </div>`;
  setFoot(`<button class="btn block" id="go">Weiter</button>`);
  $("#go").onclick = closeRun;

}

/* ---------- Konfetti ---------- */
function confetti() {
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("#confetti"); if (!cv) return;
  const ctx = cv.getContext("2d"), dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const cols = ["#D62839", "#ffffff", "#E8940F", "#0E6BA8", "#3A8A3D"];
  const ps = Array.from({ length: 110 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 120, y: innerHeight * .35, vx: (Math.random() - .5) * 11, vy: -Math.random() * 11 - 4, s: 5 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: pick(cols) }));
  let f = 0;
  const step = () => {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    ps.forEach(p => { p.vy += .32; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.strokeStyle = "rgba(0,0,0,.15)"; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s); ctx.strokeRect(-p.s / 2, -p.s / 2, p.s, p.s); ctx.restore(); });
    if (++f < 150) requestAnimationFrame(step); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  };
  requestAnimationFrame(step);
}

    html += `<h2 style="font-size:20px;margin:24px 0 10px">${u.ui === 0 ? "Start" : "Einheit " + u.ui}: ${esc(u.t)}</h2><div class="stack">${ls.map(L => `<button class="list-btn" data-act="tip" data-l="${L.id}"><span class="ico" style="background:${u.color}">${S.lessons[L.id] ? I.check : I.bulb}</span><span class="txt"><b>${esc(L.t)}</b>${S.ru && L.ru ? `<small>mit Russisch-Brücke</small>` : ""}</span><span class="chev">${I.chev}</span></button>`).join("")}</div>`;
  });
  return html + `</div>`;
}
function viewProfile() {
  const st = streak(), learned = learnedItems().filter(i => i.k === "w").length, done = Object.keys(S.lessons).filter(id => LBYID[id]).length;
  const strong = Object.values(S.items).filter(r => r.b >= 4).length;
  const t = today(), dow = (new Date().getDay() + 6) % 7, start = t - dow - 28;
  let cal = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"].map(d => `<span class="dh">${d}</span>`).join("");
  for (let n = start; n < start + 35; n++) { const x = S.days[n] || 0; const c = n > t ? "fut" : x >= S.goal ? "x3" : x >= S.goal / 2 ? "x2" : x > 0 ? "x1" : ""; cal += `<i class="${c} ${n === t ? "today" : ""}" title="${x} XP"></i>`; }
  const sw = (k, label, sub) => `<div class="set"><div><b>${label}</b>${sub ? `<small>${sub}</small>` : ""}</div><button class="switch" role="switch" aria-checked="${!!S[k]}" aria-label="${label}" data-act="tog" data-k="${k}"></button></div>`;
  const voice = TTS.ok ? `<b>${TTS.similar ? "Ähnliche Stimme" : "Kroatische Stimme"}</b><small>${esc(TTS.name)}</small>` : `<b>Keine kroatische Stimme gefunden</b><small>iPhone: Einstellungen → Bedienungshilfen → Gesprochene Inhalte → Stimmen → Kroatisch laden. Android: Einstellungen → Sprachausgabe → Google → Sprachdaten → Kroatisch. Danach die App neu öffnen – am besten im Browser (Safari/Chrome).</small>`;
  return `<div class="wrap"><h1 class="page-title">Profil</h1>
  <div class="card hero-card">${mascot("happy")}<div><div style="font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.1">${esc(S.name.trim() || "Ohne Namen")}</div><div class="muted">Niveau ${levelLabel()} · ${done} von ${LESSONS.length} Lektionen</div></div></div>
  <div class="stats" style="margin-top:12px">
   <div class="stat" style="color:var(--sun)">${I.flame}<div style="color:var(--ink)"><b>${st}</b><small>Tage in Folge</small></div></div>
   <div class="stat" style="color:var(--sun)">${I.trophy}<div style="color:var(--ink)"><b>${S.best}</b><small>Rekord-Serie</small></div></div>
   <div class="stat" style="color:var(--sea)">${I.bolt}<div style="color:var(--ink)"><b>${S.xp}</b><small>XP gesamt</small></div></div>
   <div class="stat" style="color:var(--sea)">${I.cards}<div style="color:var(--ink)"><b>${learned}</b><small>Wörter gelernt</small></div></div>
   <div class="stat" style="color:var(--good)">${I.check}<div style="color:var(--ink)"><b>${done}</b><small>Lektionen fertig</small></div></div>
   <div class="stat" style="color:var(--good)">${I.target}<div style="color:var(--ink)"><b>${strong}</b><small>Sitzen fest</small></div></div>
  </div>
  <h2 style="font-size:20px;margin:22px 0 10px">Die letzten 5 Wochen</h2><div class="card"><div class="cal">${cal}</div></div>

   <div class="set"><div><b>Name</b><small>${esc(S.name.trim() || "noch keiner")}</small></div><button class="btn ghost small" data-act="name">Ändern</button></div>

   ${sw("ru", "Russisch-Brücken", "Eselsbrücken für alle, die Russisch können")}
   ${sw("hints", "Aussprache-Hinweise", "Zeigt bei neuen Wörtern, wie č, ć, đ & Co. klingen")}
   ${sw("autoplay", "Automatisch vorlesen", "Spricht Wörter und Lösungen vor")}
   ${sw("sound", "Soundeffekte", "Kurze Töne für richtig und falsch")}
   <div class="set"><div><b>Sprechtempo</b></div><div class="choice-row">${[[0.9, "Normal"], [0.7, "Langsam"]].map(([v, l]) => `<button class="choice" data-act="rate" data-v="${v}" aria-pressed="${S.rate === v}">${l}</button>`).join("")}</div></div>
   <div class="set"><div>${voice}</div>${TTS.ok ? `<button class="btn ghost small" data-act="testvoice">Testen</button>` : ""}</div>
  </div>
  <h2 style="font-size:20px;margin:22px 0 10px">Fortschritt sichern</h2><div class="card">
   <div class="saved-state ${storageOK ? "" : "bad"}">${storageOK ? I.check : I.alert}<div><b>${storageOK ? "Speichern ist aktiv" : "Speichern klappt hier gerade nicht"}</b><small>${storageOK ? (ST.saved ? "Zuletzt gespeichert um " + pad(new Date(ST.saved).getHours()) + ":" + pad(new Date(ST.saved).getMinutes()) + " Uhr" : "Alles wird nach jeder Aufgabe gesichert") + (ST.ls && ST.idb ? " · doppelt gesichert" : "") : "Öffne mich über den Link in Safari oder Chrome, nicht im privaten Modus und nicht als Datei-Vorschau."}</small></div></div>
   <p class="muted" style="font-size:14px">Gespeichert wird in diesem Browser auf diesem Gerät. Öffne mich deshalb immer auf demselben Weg, z. B. immer über denselben Link in Safari. Mit dem Sicherungscode nimmst du alles auf ein neues Handy mit.</p>
   <div class="stack"><button class="list-btn" data-act="backup"><span class="ico" style="background:var(--sea)">${I.down}</span><span class="txt"><b>Sicherungscode anzeigen</b><small>Kopieren und z. B. in Notizen speichern</small></span></button>
   <button class="list-btn" data-act="restore"><span class="ico" style="background:var(--good)">${I.up}</span><span class="txt"><b>Code einfügen</b><small>Fortschritt von einem anderen Gerät laden</small></span></button>
   <button class="list-btn" data-act="reset"><span class="ico" style="background:var(--bad)">${I.trash}</span><span class="txt"><b>Alles zurücksetzen</b><small>Von vorne anfangen</small></span></button></div>
  </div>
  <p class="note" style="text-align:center;margin:22px 0">Pomalo · ${LESSONS.length} Lektionen · ${ALL.filter(i => i.k === "w").length} Wörter · ${ALL.filter(i => i.k === "s").length} Sätze</p></div>`;
}

/* ---------- Bottom-Sheet ---------- */
function sheet(html, onMount) {
  const el = $("#sheet");
  el.innerHTML = `<div class="scrim" data-close></div><div class="panel" role="dialog" aria-modal="true" tabindex="-1"><button class="x" data-close aria-label="Schließen">${I.close.replace("<svg", '<svg width="20" height="20"')}</button>${html}</div>`;
  el.hidden = false;
  if (onMount) onMount(el);
  setTimeout(() => { try { $(".panel", el).focus({ preventScroll: true }); } catch (e) {} }, 20);
}
function closeSheet() { const el = $("#sheet"); el.hidden = true; el.innerHTML = ""; }

function encodeState() { const json = JSON.stringify(Object.assign({}, S, { run: null })); return "POMALO1:" + btoa(unescape(encodeURIComponent(json))); }
function decodeState(code) { const c = code.trim().replace(/^POMALO1:/, "").replace(/\s+/g, ""); const obj = JSON.parse(decodeURIComponent(escape(atob(c)))); if (!obj || typeof obj !== "object" || !obj.lessons) throw new Error("bad"); return obj; }

/* ---------- Aktionen ---------- */
const ACT = {
  tab: b => { curTab = b.dataset.tab; window.scrollTo(0, 0); renderTabs(); renderView(); },
  node: b => lessonSheet(LBYID[b.dataset.l]),
  start: b => { const L = LBYID[b.dataset.l]; if (b.dataset.fresh !== "1" && runMatches("lesson", L)) resumeRun(); else startRun("lesson", L); },
  resume: () => resumeRun(),
  review: () => { if (runMatches("review")) resumeRun(); else startRun("review"); },
  weak: () => { if (runMatches("weak")) resumeRun(); else if (weakItems().length) startRun("weak"); },
  random: () => { if (runMatches("random")) resumeRun(); else startRun("random"); },
  filetip: () => { S.fileTipOff = true; save(); renderView(); },
  quit: () => { closeSheet(); closeRun(); },
  tip: b => { const L = LBYID[b.dataset.l]; sheet(`<div style="color:${L.u.color};font-weight:800;font-size:12px;letter-spacing:.09em;text-transform:uppercase">Grammatik-Tipp</div><h3>${esc(L.t)}</h3><div class="rich">${L.g}${ruBox(L.ru)}</div>`); },
  ref: b => { const r = REF.find(x => x.id === b.dataset.id); sheet(`<h3>${esc(r.t)}</h3><div class="rich">${r.h}</div>`); },
  seg: b => { wordsState.seg = b.dataset.v; wordsState.limit = 200; renderView(); },
  filter: b => { wordsState.filter = b.dataset.v; wordsState.limit = 200; renderView(); },
  more: () => { wordsState.limit += 300; $("#wlist").innerHTML = wordList(); },
  tog: b => { const k = b.dataset.k; S[k] = !S[k]; save(); b.setAttribute("aria-checked", String(!!S[k])); },
  gender: b => { S.gender = b.dataset.v; save(); renderView(); },
  goal: b => { S.goal = +b.dataset.v; save(); renderAll(); },
  rate: b => { S.rate = +b.dataset.v; save(); renderView(); TTS.speak("Polako, polako."); },
  testvoice: () => TTS.speak("Bok! Ja sam Pjegica. Učimo hrvatski zajedno!"),
  name: () => { sheet(`<h3>Wie heißt du?</h3><p class="sub">Damit Pjegica dich begrüßen kann – und für Übungen wie „Zovem se …“.</p><input class="field" id="nm" maxlength="30" value="${esc(S.name)}" autocomplete="given-name"><div class="sheet-actions"><button class="btn block" id="nmok">Speichern</button></div>`, el => { const i = $("#nm", el); setTimeout(() => i.focus(), 60); const go = () => { S.name = i.value.trim().slice(0, 30); save(); closeSheet(); renderAll(); }; $("#nmok", el).onclick = go; i.onkeydown = e => { if (e.key === "Enter") go(); }; }); },
  backup: () => { const code = encodeState(); sheet(`<h3>Dein Sicherungscode</h3><p class="sub">Kopier den Code und heb ihn gut auf (z. B. in Notizen oder schick ihn dir selbst).</p><textarea class="code" id="cd" readonly>${esc(code)}</textarea><div class="sheet-actions"><button class="btn block" id="cp">Kopieren</button><p class="note" id="cpmsg" aria-live="polite"></p></div>`, el => { $("#cp", el).onclick = () => { const ta = $("#cd", el); const sel = () => { ta.focus(); ta.select(); $("#cpmsg", el).textContent = "Code ist markiert – jetzt kopieren."; }; try { navigator.clipboard.writeText(code).then(() => { $("#cpmsg", el).textContent = "Kopiert!"; }, sel); } catch (e) { sel(); } }; }); },
  restore: () => { sheet(`<h3>Code einfügen</h3><p class="sub">Achtung: Der Fortschritt auf diesem Gerät wird ersetzt.</p><textarea class="code" id="rc" placeholder="POMALO1:…" aria-label="Sicherungscode"></textarea><div class="sheet-actions"><button class="btn block good" id="rcok">Fortschritt laden</button><p class="note" id="rcmsg" aria-live="polite"></p></div>`, el => { $("#rcok", el).onclick = () => { try { const o = decodeState($("#rc", el).value); S = Object.assign(DEF(), o); save(); closeSheet(); renderAll(); } catch (e) { $("#rcmsg", el).textContent = "Der Code passt nicht. Kopier ihn bitte komplett, inklusive „POMALO1:“."; } }; }); },
  reset: () => { sheet(`${mascot("sad")}<h3>Wirklich alles löschen?</h3><p class="sub">Lektionen, Wörter, Serie und XP auf diesem Gerät sind dann weg. Tipp: Vorher den Sicherungscode kopieren.</p><div class="sheet-actions"><button class="btn block" data-close>Abbrechen</button><button class="btn bad block" data-act="reset2">Ja, alles löschen</button></div>`, el => { const m = $(".mascot", el); m.style.width = "80px"; m.style.height = "80px"; }); },
  reset2: () => { const keep = { name: S.name, gender: S.gender }; S = Object.assign(DEF(), keep, { onboarded: true }); save(); closeSheet(); curTab = "learn"; renderAll(); },
};
document.addEventListener("click", e => {
  const say = e.target.closest("[data-say]");
  if (say) { TTS.speak(say.dataset.say, say.dataset.slow === "1"); if (say.tagName === "BUTTON" && !say.classList.contains("dl")) return; }
  if (e.target.closest("[data-close]")) { closeSheet(); return; }
  const b = e.target.closest("[data-act]");
  if (b && ACT[b.dataset.act] && !b.disabled) ACT[b.dataset.act](b);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("#sheet").hidden) { closeSheet(); return; }
  if (!R || !$("#sheet").hidden) return;
  if (e.target && (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT")) return;
  if (e.key === "Enter") {
    const fb = $("#fbnext"); if (fb) { e.preventDefault(); fb.click(); return; }
    const go = $("#go") || $("#chk"); if (go && !go.disabled) { e.preventDefault(); go.click(); }
  } else if (/^[1-4]$/.test(e.key)) {
    const o = $$("#lxb .opt")[+e.key - 1]; if (o && !o.disabled) o.click();
  }
});

/* ---------- Willkommen ---------- */
function onboarding() {
  const ob = $("#onboard");
  const st = { gender: S.gender || "f", goal: S.goal || 20, ru: S.ru !== false };
  const draw = () => {
    ob.innerHTML = `<div class="ob">${mascot("happy")}<h1>Bok! Ja sam Pjegica.</h1><p class="lead">Ich bin ein Dalmatiner – wie der Name schon sagt, direkt aus Dalmatien. Zusammen lernen wir Kroatisch: jeden Tag ein paar Minuten, <i>pomalo</i>, ganz entspannt.</p>
    ${noticeHtml()}
    <div class="checker" aria-hidden="true"></div>
    <div><label class="q" for="obn">Wie heißt du?</label><input class="field" id="obn" maxlength="30" placeholder="Dein Vorname" autocomplete="given-name" value="${esc(S.name)}"></div>
    <div><span class="q" style="font-weight:800;display:block;margin-bottom:8px">Wie soll ich dich ansprechen?</span><div class="choice-row">${[["f", "Als Frau", "bila sam, sretna sam"], ["m", "Als Mann", "bio sam, sretan sam"]].map(([k, l, s]) => `<button class="choice" data-ob="gender" data-v="${k}" aria-pressed="${st.gender === k}">${l}<small>${s}</small></button>`).join("")}</div>
    <p class="note" style="margin-top:6px">Im Kroatischen hängen manche Formen davon ab, wer spricht.</p></div>
    <div><span class="q" style="font-weight:800;display:block;margin-bottom:8px">Dein Tagesziel</span><div class="choice-row">${[[10, "Locker", "≈ 5 Min."], [20, "Normal", "≈ 10 Min."], [30, "Ernst", "≈ 15 Min."], [50, "Intensiv", "≈ 25 Min."]].map(([v, l, s]) => `<button class="choice" data-ob="goal" data-v="${v}" aria-pressed="${st.goal === v}">${l}<small>${s}</small></button>`).join("")}</div></div>
    <div class="set" style="border:2px solid var(--line);border-radius:14px;padding:12px 14px"><div><b>Ich kann Russisch</b><small>Dann zeige ich dir Eselsbrücken und falsche Freunde.</small></div><button class="switch" role="switch" aria-checked="${st.ru}" aria-label="Ich kann Russisch" data-ob="ru"></button></div>
    <button class="btn block red" id="obgo">Idemo! · Los geht's</button>
    <p class="note" style="text-align:center;margin-top:-6px">Dein Fortschritt wird auf diesem Handy gespeichert. Öffne mich am besten immer auf demselben Weg, z. B. über denselben Link im selben Browser.</p></div>`;
    $$("[data-ob]", ob).forEach(b => b.onclick = () => {
      const k = b.dataset.ob; S.name = $("#obn", ob).value;
      if (k === "ru") st.ru = !st.ru; else st[k] = k === "goal" ? +b.dataset.v : b.dataset.v;
      draw();
    });
    $("#obgo", ob).onclick = () => {
      S.name = $("#obn", ob).value.trim().slice(0, 30); S.gender = st.gender; S.goal = st.goal; S.ru = st.ru; S.onboarded = true; save();
      ob.hidden = true; renderAll();
      TTS.speak("Bok" + (S.name ? ", " + S.name : "") + "!");
    };
  };
  draw(); ob.hidden = false;
}

/* ---------- Start ---------- */
function boot() {
  load();
  document.body.insertAdjacentHTML("beforeend", `
  <div id="lesson" hidden><div class="lx-top"><button class="lx-close" id="lxclose" aria-label="Runde beenden">${I.close}</button><div class="lx-prog" role="progressbar" aria-label="Fortschritt"><i></i></div><div class="lx-combo"></div></div>
  <div class="lx-body"><div class="wrap" id="lxb"></div></div><div class="lx-foot"><div class="wrap" id="lxf"></div></div><div class="lx-fb" hidden aria-live="polite"></div></div>
  <div id="sheet" hidden></div><div id="onboard" hidden></div><canvas id="confetti" aria-hidden="true"></canvas>`);
  $("#lxclose").onclick = () => { if (R && R.i >= R.list.length) closeRun(); else askQuit(); };
  TTS.init();
  let shown = false;
  const show = () => { if (shown) return; shown = true; renderAll(); if (!S.onboarded) onboarding(); };
  const okBefore = storageOK;
  loadIDB().then(newer => {
    if (!shown) return show();
    if (newer && S.onboarded) $("#onboard").hidden = true;
    if ((newer || okBefore !== storageOK) && !R) { renderAll(); if (!$("#onboard").hidden && !S.onboarded) onboarding(); }
  });
  setTimeout(show, 600);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && S.onboarded) save(); });
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();

})();
